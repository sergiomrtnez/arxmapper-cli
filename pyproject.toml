[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arxmapper"
version = "0.1.0"
description = "Herramienta TUI interactiva para analizar y documentar la arquitectura de repositorios con modelos de IA locales (Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ArxMapper Team" }
]
keywords = ["tui", "textual", "ollama", "llm", "cli", "architecture", "code-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "textual>=0.50.0",
    "ollama>=0.3.0",
    "rich>=13.0.0",
]

[project.scripts]
arxmapper = "app:main"
